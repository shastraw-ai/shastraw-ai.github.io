<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Trading Dashboard</title>
<style>
:root {
    --bg: #1a1a2e;
    --panel: #16213e;
    --text: #e0e0e0;
    --muted: #888;
    --blue: #42a5f5;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: var(--bg);
    color: var(--text);
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 13px;
    padding: 24px;
    max-width: 1200px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}
.placeholder {
    text-align: center;
    background: var(--panel);
    padding: 48px 64px;
    border-radius: 8px;
}
h1 { font-size: 20px; margin-bottom: 12px; color: var(--blue); }
p { color: var(--muted); }
</style>
</head>
<body>
<div class="placeholder">
    <h1>Live Trading Dashboard</h1>
    <p>Reports will appear here once live trading begins.</p>
</div>
</body>
</html>
