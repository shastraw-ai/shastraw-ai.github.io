<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Performance</title>
<style>:root {
    --bg: #0f1419; --panel: #1a1f2a; --panel2: #0f3460;
    --text: #e0e0e0; --muted: #888;
    --pos: #4caf50; --neg: #ef5350; --blue: #42a5f5;
    --orange: #ff9800; --border: #333;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: var(--bg); color: var(--text);
    font-family: 'SF Mono','Fira Code','Consolas',monospace;
    font-size: 13px; padding: 24px; max-width: 1200px; margin: 0 auto;
}
h1 { font-size: 20px; margin-bottom: 6px; color: var(--blue); }
.subtitle { color: var(--muted); font-size: 12px; margin-bottom: 20px; }
.metrics-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr));
    gap: 12px; margin-bottom: 24px;
}
.metric-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 12px;
}
.metric-label { font-size: 11px; color: var(--muted); text-transform: uppercase; }
.metric-value { font-size: 18px; font-weight: bold; margin-top: 4px; }
.pos { color: var(--pos); }
.neg { color: var(--neg); }
.neutral { color: var(--text); }
.chart-box { margin: 24px 0; }
.footer {
    margin-top: 32px; padding-top: 12px;
    border-top: 1px solid var(--border); color: var(--muted); font-size: 11px;
}
</style>
<script src="https://cdn.plot.ly/plotly-basic-2.35.2.min.js"></script>
</head>
